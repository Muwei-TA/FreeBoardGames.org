events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8080;
    set $web_target http://web:3000;
    set $bgio_target http://bgio:8001;
    set $backend_target http://backend:3001;
    location /socket.io/ {
      proxy_pass $bgio_target;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600s;
    }
    location /graphql {
      proxy_pass $backend_target;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600s;
    }
    location / { proxy_pass $web_target; proxy_set_header Host $http_host; }
  }
}
