zh:
  code: tictactoe
  name: 井字棋
  callout: 经典游戏
  descriptionTag: |
    免费在线玩井字棋（也称圈叉棋）。你可以单人对抗电脑，在线与好友多人对战，或共用设备与好友本地对战。
  instructions:
    videoId: USEjXNCTvcc
    text: |
      井字棋是一款经典的两人游戏。棋盘为 3x3 网格，玩家轮流在网格的格子中放置自己的标记（X 或 O）。
      要获胜，玩家必须用自己的标记连成一条完整的横线、竖线或斜线。如果所有格子都被填满且没有玩家做到这一点，则为平局。
